<svg xmlns="http://www.w3.org/2000/svg"
     width="440"
     height="180"
     viewBox="0 0 440 180">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#191638"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>

  <rect width="440" height="180" rx="16"
        fill="url(#background)"/>

  <rect x="1" y="1" width="438" height="178" rx="15"
        fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <text x="220" y="30"
        fill="#00f5ff"
        font-family="monospace"
        font-size="13"
        text-anchor="middle"
        letter-spacing="2">
    GITHUB ACHIEVEMENTS
  </text>

  <line x1="35" y1="43" x2="405" y2="43"
        stroke="#7b2ff7" stroke-opacity="0.7"/>

  <!-- Official GitHub Pull Shark artwork -->
  <image
    href="https://github.githubassets.com/images/modules/profile/achievements/pull-shark-default.png"
    x="95" y="54" width="90" height="90"
    preserveAspectRatio="xMidYMid meet"/>

  <!-- Official GitHub YOLO artwork -->
  <image
    href="https://github.githubassets.com/images/modules/profile/achievements/yolo-default.png"
    x="255" y="54" width="90" height="90"
    preserveAspectRatio="xMidYMid meet"/>

  <text x="140" y="160"
        fill="#00f5ff"
        font-family="monospace"
        font-size="12"
        text-anchor="middle">
    PULL SHARK
  </text>

  <text x="300" y="160"
        fill="#c9c9ff"
        font-family="monospace"
        font-size="12"
        text-anchor="middle">
    YOLO
  </text>

</svg>
